name: audit
on:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/audit.yml"

permissions: {}

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx install uv
      - name: Install runtime deps into a venv to audit
        run: |
          uv venv .venv
          source .venv/bin/activate
          # Install only runtime deps (not [dev]) — that's what users actually
          # install, and what Dependabot tracks against.
          uv pip install -e .
      # Scan the venv's installed package set. Passing the venv directory via
      # `virtual-environment` audits exactly what `pip install -e .` produced.
      - uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          virtual-environment: .venv
