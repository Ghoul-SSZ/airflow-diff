name: audit
on:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/audit.yml"

permissions: {}

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pipx install uv
      - name: Freeze runtime deps to a requirements file
        run: |
          uv venv .venv
          # Install only runtime deps (not [dev]) — that's what users actually
          # install, and what Dependabot tracks against.
          uv pip install --python .venv/bin/python -e .
          uv pip freeze --python .venv/bin/python > /tmp/audit-requirements.txt
          # Strip the editable self-install line (pip-audit can't resolve "-e ."
          # against the local checkout).
          grep -v "^-e " /tmp/audit-requirements.txt > /tmp/audit-requirements.clean.txt
          mv /tmp/audit-requirements.clean.txt /tmp/audit-requirements.txt
          echo "--- audit requirements ---"
          cat /tmp/audit-requirements.txt
      - uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: /tmp/audit-requirements.txt
