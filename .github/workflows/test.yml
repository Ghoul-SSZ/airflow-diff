name: test
on:
  push:
    branches: [main]
  pull_request:

# Default to no permissions; each job grants only what it needs.
# No job in this workflow uses GITHUB_TOKEN.
permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pipx install uv
      - run: uv pip install --system -e ".[dev]"
      - run: pytest tests/unit -v --cov=airflow_diff --cov-report=xml --cov-report=term
      - uses: actions/upload-artifact@v7
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        with:
          name: coverage-xml
          path: coverage.xml

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        airflow-version: ["2.8.4", "2.9.3", "2.10.3"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pipx install uv
      - name: Install with pinned Airflow
        run: |
          uv venv .venv
          source .venv/bin/activate
          uv pip install -e .
          uv pip install "apache-airflow==${{ matrix.airflow-version }}" pytest pytest-cov pytest-timeout syrupy
      - name: Run integration tests
        run: |
          source .venv/bin/activate
          pytest tests/integration -v -m integration --timeout=600

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: bash tests/smoke/test_action_entrypoint.sh
