name: test
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx install uv
      - run: uv pip install --system "ruff>=0.5.0"
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/

  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pipx install uv
      - run: uv pip install --system -e ".[dev]"
      - run: pytest tests/unit -v

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        airflow-version: ["2.8.4", "2.9.3", "2.10.3"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pipx install uv
      - name: Install with pinned Airflow
        run: |
          uv venv .venv
          source .venv/bin/activate
          uv pip install -e .
          uv pip install "apache-airflow==${{ matrix.airflow-version }}" pytest pytest-cov pytest-timeout syrupy
      - name: Run integration tests
        run: |
          source .venv/bin/activate
          pytest tests/integration -v -m integration --timeout=600

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/smoke/test_action_entrypoint.sh
