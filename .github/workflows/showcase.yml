name: showcase
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/airflow_diff/**"
      - "examples/showcase/**"
      - "docs/showcase/**"
      - "tests/regression/**"
      - ".github/workflows/showcase.yml"

permissions: {}

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pipx install uv
      - name: Install
        run: |
          uv venv .venv
          source .venv/bin/activate
          uv pip install -e ".[dev]"
      - name: Run showcase regression tests
        run: |
          source .venv/bin/activate
          pytest tests/regression -v -m integration --timeout=900
