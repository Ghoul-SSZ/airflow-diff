[project]
name = "airflow-diff"
version = "0.1.0"
description = "Render and diff Apache Airflow DAGs across two git commits"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "croniter>=2.0",
    "tomli>=2.0; python_version<'3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-timeout>=2.2",
    "syrupy>=4.6",
    # Airflow installed only for renderer integration tests:
    "apache-airflow==2.10.3",
]

[project.scripts]
airflow-diff = "airflow_diff.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: integration tests that import Airflow",
]
